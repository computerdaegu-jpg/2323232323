<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - MELLOW BEAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <!-- Navigation -->
  <nav id="navbar">
    <a href="../index.html" class="logo">MELLOW BEAN</a>
  </nav>

  <!-- Login -->
  <section id="login">
    <div class="login-card">
      <h2>Login</h2>
      <p>MELLOW BEAN에 오신 것을 환영합니다.</p>

      <form class="login-form">
        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호" required />
        </div>
        <button type="submit" class="btn">로그인</button>
      </form>

      <a href="signup.html" class="back-link">아직 계정이 없으신가요? 회원가입하기</a>
      <br />
      <a href="../index.html" class="back-link">← 홈으로 돌아가기</a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 MELLOW BEAN. All rights reserved.</p>
  </footer>
</body>
</html>
