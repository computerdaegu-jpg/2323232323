<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - MELLOW BEAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <!-- Navigation -->
  <nav id="navbar">
    <a href="../index.html" class="logo">MELLOW BEAN</a>
  </nav>

  <!-- Sign Up -->
  <section id="login">
    <div class="login-card">
      <h2>Sign Up</h2>
      <p>MELLOW BEAN의 회원이 되어보세요.</p>

      <form class="login-form">
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" placeholder="이름" required />
        </div>
        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호" required />
        </div>
        <div class="form-group">
          <label for="password-confirm">비밀번호 확인</label>
          <input type="password" id="password-confirm" name="password-confirm" placeholder="비밀번호 확인" required />
        </div>
        <button type="submit" class="btn">회원가입</button>
      </form>

      <a href="login.html" class="back-link">이미 계정이 있으신가요? 로그인하기</a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 MELLOW BEAN. All rights reserved.</p>
  </footer>
</body>
</html>
